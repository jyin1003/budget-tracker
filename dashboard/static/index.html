<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Analytics</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header class="header">
        <div class="logo">budget<span>.</span>analytics</div>
        <nav class="tab-nav">
            <button class="tab-btn active" id="tab-dashboard" data-tab="dashboard">dashboard</button>
            <button class="tab-btn" id="tab-trends" data-tab="trends">trends</button>
        </nav>
        <div class="month-picker" id="month-picker">
            <label>month</label>
            <select id="month-select" onchange="loadMonth(this.value)"></select>
        </div>
    </header>

    <div class="page" id="page">
        <div class="loading-screen">loading…</div>
    </div>

    <div class="page" id="trends-page" style="display:none">
        <div class="loading-screen">loading…</div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
